# Continuous integration.
#
# Three things run on every push and pull request: the linter, a production
# build, and the server test suite. They are separate jobs rather than steps in
# one, so a lint failure and a test failure are told apart at a glance instead
# of the first one hiding the second.
#
# The tests need a real MongoDB — the harness spawns the actual server and
# talks to it over HTTP and Socket.IO rather than mocking either. A service
# container gives it one, and the suite already points at a throwaway
# `chatapp_test` database it drops on the way out.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch makes the first run irrelevant, so stop it
# rather than paying for both.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run lint

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run build

      # Proof the build produced something, so a silently-empty dist cannot
      # pass as success.
      - name: Check the bundle exists
        run: |
          test -f dist/index.html
          ls -la dist/assets

  test:
    name: Server tests
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        # Without a health check the suite can start before Mongo is accepting
        # connections, which fails as a confusing ECONNREFUSED in the harness
        # rather than as "the database was not ready".
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      # Node 22: `node --test` only accepts glob patterns from 21 onwards, and
      # the test script passes "test/**/*.test.js".
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      # No MONGODB_URI here on purpose. The harness hardcodes
      # mongodb://127.0.0.1:27017/chatapp_test and passes it to the server it
      # spawns, ignoring whatever is in the environment — which is a safety
      # feature, not an oversight. It drops that database on the way out, and
      # an env var able to redirect it is an env var able to point a
      # drop-database at somebody's real data.
      - name: Run the suite
        working-directory: server
        run: npm test
