[pytest]
testpaths = tests

# The service's modules sit at the top of ai/, not in a package, so the
# directory itself has to be importable: `import chunking` rather than
# `import ai.chunking`. That matches how the service runs (uvicorn app:app
# from inside ai/), so tests import exactly what production imports.
pythonpath = .

addopts = -q --strict-markers

markers =
    needs_mongo: requires the Atlas Local container on 27018. Skipped when it is not reachable, so the pure-logic tests still run on a laptop with Docker closed.
