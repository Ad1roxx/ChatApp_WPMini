<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#faf9f7" />
    <meta
      name="description"
      content="MentorConnect — a mentorship workspace for students and mentors."
    />

    <!--
      Inter, loaded from Google Fonts. preconnect first so the font request
      doesn't wait on a fresh TCP + TLS handshake; `display=swap` so text
      renders in the fallback immediately rather than staying invisible while
      the font downloads. The stack in tokens.css falls back to system fonts
      if this never arrives.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <title>MentorConnect</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
